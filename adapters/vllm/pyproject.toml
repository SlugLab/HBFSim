[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hbfsim-vllm"
version = "0.1.0"
description = "HBFSim timing-only model loader for vLLM"
requires-python = ">=3.11"

[project.entry-points."vllm.general_plugins"]
hbfsim_model_loader = "hbfsim_loader:register"

[tool.setuptools]
py-modules = ["hbfsim_loader", "triton_binding", "prepare_triton_ptx"]
