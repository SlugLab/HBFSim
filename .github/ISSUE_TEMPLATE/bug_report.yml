name: Bug report
description: Report a build failure, crash, incorrect result, or missing instrumentation.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please include what you know. Write "unknown" for information you cannot obtain.
        Remove access tokens, passwords, private model URLs, and personal data from logs.
        For help getting started, use the Q&A Discussion form instead.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the expected result and what happened instead. For a timing problem, name the time field you are comparing.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: HBFSim version
      description: Paste git rev-parse HEAD and mention any local changes. Include submodule revisions if available.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Commands and settings
      description: Include the configure/build commands, run command, relevant environment variables, HBF profile, and SASS lifter setting. Replace private paths with consistent placeholders.
      render: shell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Machine and software
      description: Include Linux distribution, CPU architecture, GPU model, driver, CUDA build roots, nvcc/ptxas versions, CMake and C++ compiler. For model runs, also include Python, PyTorch, vLLM and Triton versions.
      render: text
    validations:
      required: true
  - type: textarea
    id: model
    attributes:
      label: Model and input
      description: Model ID and revision, data type, selected weights/layers, prompt/input lengths, output length, seed, and whether the same input works without HBFSim. Do not upload model weights.
  - type: textarea
    id: logs
    attributes:
      label: Complete first error and surrounding log
      description: Start before the first error and include its full diagnostic text, not only the final abort. For PTX compilation, include the compiler version, target, PTX version, options and compiler error log. Attach a text file if the log is long.
      render: text
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Coverage report or small reproducer
      description: Attach available coverage/pass manifests, binding report, ctest output, or a small reproducer. Say whether instrumentation is missing, binding failed, or a bound kernel actually ran. Missing files are useful information too.
